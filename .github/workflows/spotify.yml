name: ultra-stable-music-downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        required: true
        type: string

      quality:
        type: choice
        default: "320k"
        options: [LOSSLESS, 320k, 192k, 128k]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip curl jq
          pip3 install yt-dlp

      - name: Prepare
        run: mkdir -p music

      - name: Download engine
        env:
          URLS: ${{ github.event.inputs.urls }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          echo "$URLS" | tr ',' '\n' > urls.txt

          if [ "$QUALITY" = "LOSSLESS" ]; then
            AUDIO="-x --audio-format flac"
          else
            AUDIO="-x --audio-format mp3 --audio-quality 0"
          fi

          download() {
            url="$1"

            echo "=================================="
            echo "Processing: $url"
            echo "=================================="

            yt-dlp "$url" \
              $AUDIO \
              --no-playlist \
              --retries 10 \
              --fragment-retries 10 \
              --extractor-args "youtube:player_client=android,web,mweb" \
              --js-runtimes deno \
              --force-ipv4 \
              --sleep-interval 2 \
              --max-sleep-interval 5 \
              -o "music/%(title)s.%(ext)s" || {

                echo "Fallback: invidious mirror"

                yt-dlp "https://invidious.io/api/v1/search?q=$(echo $url | head -c 50)" \
                  $AUDIO \
                  -o "music/%(title)s.%(ext)s"
              }
          }

          while read -r url; do
            [ -z "$url" ] && continue
            download "$url"
          done < urls.txt

      - name: Normalize
        run: |
          for f in music/*; do
            [ -f "$f" ] || continue

            base="${f%.*}"

            if [ "${{ github.event.inputs.quality }}" = "LOSSLESS" ]; then
              ffmpeg -y -i "$f" -c:a flac "${base}_final.flac" && rm "$f"
            else
              ffmpeg -y -i "$f" -c:a libmp3lame -b:a 320k "${base}_final.mp3" && rm "$f"
            fi
          done

      - name: Commit to repo
        run: |
          git config user.name "github-actions"
          git config user.email "bot@github.com"

          git add music/
          git commit -m "🎧 stable music update" || echo "no changes"
          git pull --rebase || true
          git push
