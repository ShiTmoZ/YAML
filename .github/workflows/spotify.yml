name: stable-music-downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        required: true
        type: string

      quality:
        type: choice
        default: "320k"
        options: [LOSSLESS, 320k, 192k, 128k]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip curl jq
          pip3 install yt-dlp

      - name: Prepare
        run: mkdir -p music

      - name: Downloader Engine
        env:
          URLS: ${{ github.event.inputs.urls }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          echo "$URLS" | tr ',' '\n' > urls.txt

          # quality map
          if [ "$QUALITY" = "LOSSLESS" ]; then
            AUDIO="-x --audio-format flac"
          else
            AUDIO="-x --audio-format mp3 --audio-quality 0"
          fi

          extract_spotify() {
            url="$1"
            id=$(echo "$url" | awk -F'/' '{print $NF}' | cut -d'?' -f1)

            # extract page title (NO DRM bypass, only metadata)
            title=$(curl -s "https://open.spotify.com/track/$id" \
              | grep -oP '(?<=<title>).*?(?=</title>)' \
              | sed 's/ | Spotify//')

            echo "$title"
          }

          download_youtube() {
            query="$1"

            yt-dlp "ytsearch1:${query}" \
              $AUDIO \
              --no-playlist \
              --retries 5 \
              -o "music/%(title)s.%(ext)s"
          }

          while read -r url; do
            [ -z "$url" ] && continue

            echo "================================="
            echo "Processing: $url"
            echo "================================="

            if echo "$url" | grep -q "spotify.com"; then
              query=$(extract_spotify "$url")

              if [ -z "$query" ]; then
                echo "Fallback: using raw ID"
                query=$(echo "$url" | awk -F'/' '{print $NF}' | cut -d'?' -f1)
              fi

              echo "Resolved query: $query"
              download_youtube "$query"
            else
              yt-dlp "$url" $AUDIO -o "music/%(title)s.%(ext)s"
            fi

          done < urls.txt

      - name: Normalize
        run: |
          for f in music/*; do
            [ -f "$f" ] || continue

            base="${f%.*}"

            if [ "$QUALITY" = "LOSSLESS" ]; then
              ffmpeg -y -i "$f" -c:a flac "${base}_final.flac" && rm "$f"
            else
              ffmpeg -y -i "$f" -c:a libmp3lame -b:a 320k "${base}_final.mp3" && rm "$f"
            fi
          done

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "bot@github.com"

          git add music/
          git commit -m "🎵 music update" || echo "no changes"
          git pull --rebase || true
          git push
